# Capture screen text (Bible Part 19.2, Part 22). English; add messages_<lang>.properties for other languages.
# Rules: guidance for quality problems, silence for security problems; never a score, never a cause of rejection.
# Keys are message ids from the engine. "id#value" overrides "id" for a one-parameter message.

pramaan.status.connecting=Connecting to the camera…
pramaan.status.position=Centre your face in the oval
pramaan.status.checking=Checking face liveness…
pramaan.status.capturing=Hold still
pramaan.status.success=Good, face captured successfully
pramaan.status.action-detected=Action detected
pramaan.status.attempt=Attempt {attempt} of {max}
pramaan.status.scan=Scan
pramaan.status.retry=Try again
pramaan.status.wait=Please wait {seconds} seconds before trying again
pramaan.status.wait#1=Please wait 1 second before trying again
pramaan.status.offline=Offline — working normally
pramaan.status.stale-policy=Face verification settings are out of date. Please sync when online.

pramaan.guidance.look-at-camera=Please look at the camera
pramaan.guidance.one-person=Only one person should be in view
pramaan.guidance.quality=We could not see your face clearly. Please look directly at the camera.
pramaan.guidance.move-closer=Please move closer
pramaan.guidance.face-camera=Please look directly at the camera
pramaan.guidance.hold-still=Please hold still
pramaan.guidance.more-light=Please improve the lighting
pramaan.guidance.less-light=Too much light on your face. Please move away from the bright light
pramaan.guidance.even-light=Please make the light on your face even
pramaan.guidance.light-behind=Please move so that the light is not behind you

pramaan.challenge.turn=Please turn your head to your {direction}
pramaan.challenge.blink=Please blink {count} times
pramaan.challenge.blink#1=Please blink once
pramaan.challenge.eyes-closed=Please close your eyes. Open them when you hear the tone
pramaan.challenge.smile=Please smile
pramaan.challenge.gaze=Please look at the dot
pramaan.challenge.flash=Please keep looking at the screen
pramaan.value.direction.LEFT=left
pramaan.value.direction.RIGHT=right

pramaan.error.device-unavailable=Camera not connected. Please check the device.
pramaan.error.camera-busy=Camera is in use or blocked.
pramaan.error.not-completed=Face verification could not be completed. Please try again.
pramaan.error.try-again=We could not verify face liveness. Please try again.
pramaan.error.locked=Face verification could not be completed. The operator will help you with the next step.
pramaan.error.unavailable=Face verification is unavailable. Please contact support.
