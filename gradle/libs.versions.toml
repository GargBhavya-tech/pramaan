# Every third-party library must also appear in docs/licences.md (Build Map #7).
[versions]
junit = "5.11.4"
jackson = "2.18.2"
# PINNED - do not bump without reading tools/versions.md. ONNX Runtime 1.21.0+ needs the Visual C++
# runtime >= 14.40 already loaded in the process; JDKs that bundle an older msvcp140.dll (this one
# ships 14.36) then fail with "DLL initialization routine failed". 1.20.0 is the newest that loads.
onnxruntime = "1.20.0"
# The version MOSIP's own biometrics-util 1.2.0.3 ships: no second copy, no conflict (docs/licences.md).
jai-imageio-jpeg2000 = "1.3.0"
# The OpenJFX release MOSIP Registration Client 1.2.x pins (registration/pom.xml, openjfx.version): the scaffold
# (ADR 0003) and a later patch into the real client must not bring a second JavaFX. Desktop only; core stays UI-free.
javafx = "11.0.2"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
jai-imageio-jpeg2000 = { module = "com.github.jai-imageio:jai-imageio-jpeg2000", version.ref = "jai-imageio-jpeg2000" }
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
