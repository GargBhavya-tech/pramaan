# Builds and tests the JVM modules on every push and pull request. The Android build needs the Android SDK and is not run
# here. Model files and the vendored MockMDS are not in the repository, so tests that need them skip themselves.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Verify registration-client patches apply cleanly against upstream checkouts
        shell: bash
        run: |
          UPSTREAM_DIR="${RUNNER_TEMP:-/tmp}/upstream-repos"
          mkdir -p "$UPSTREAM_DIR"
          git clone --depth 1 --branch v1.2.0.2 https://github.com/mosip/registration-client.git "$UPSTREAM_DIR/registration-client"
          git -C "$UPSTREAM_DIR/registration-client" apply --check "$GITHUB_WORKSPACE/integration/registration-client/0001-pramaan-liveness-hooks.patch"
          git clone --depth 1 https://github.com/mosip/android-registration-client.git "$UPSTREAM_DIR/android-registration-client"
          git -C "$UPSTREAM_DIR/android-registration-client" apply --check "$GITHUB_WORKSPACE/integration/android-registration-client/0001-pramaan-android-liveness-hooks.patch"

      - name: Build and test (Linux, under a virtual display for the JavaFX tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew checkModelLicences :core:build :sbi:build :harness:build :desktop:build :regclient-stub:build :regclient-adapter:build :android-regclient-stub:build :android-regclient-adapter:build --no-daemon

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew checkModelLicences :core:build :sbi:build :harness:build :desktop:build :regclient-stub:build :regclient-adapter:build :android-regclient-stub:build :android-regclient-adapter:build --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests'
